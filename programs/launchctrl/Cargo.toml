[package]
name = "launchctrl"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "launchctrl"

[features]
default = []
# Mainnet build flag. Default build = devnet (unchanged workflow).
# `anchor build --features mainnet --ignore-keys` swaps declare_id!,
# REWARDS_AUTHORITY, PLATFORM_FEE_VAULT, and the launchctrl self-entry
# in RICOCHET_EXEMPT_PROGRAMS to their mainnet values.
mainnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Declared (not enabled) so rustc's `unexpected_cfgs` lint stops flagging
# Anchor's macro-emitted feature checks. Per Anchor v1 migration guide §7
# Option A. None of these change behavior — they only tell the compiler
# "yes, these cfg names are known to us."
anchor-debug = []
custom-heap = []
custom-panic = []

# Tells rustc that `target_os = "solana"` is a known target value on host
# builds (it IS defined when compiling for the SBF target, but the host
# build of the IDL extractor doesn't know that). Used by upstream macros
# in `solana_program_entrypoint::custom_heap_default` / `custom_panic_default`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }


[dependencies]
anchor-lang = "1.0.2"
anchor-spl = { version = "1.0.2", features = ["token", "token_2022", "token_2022_extensions"] }
solana-instructions-sysvar = { version = "3.0.0", default-features = false }
solana-security-txt = "1.1.3"

[dev-dependencies]
proptest = "1.5"
mollusk-svm = "0.12"
mollusk-svm-programs-token = "0.12"
spl-token-interface = "2"
solana-program-option = "3"
# Mollusk 0.12 targets the post-Agave split-out crates (solana-instruction 3,
# solana-pubkey 3, solana-account 3) — using the old bundled solana-sdk = "2"
# would put two incompatible copies of `solana::instruction::Instruction` in
# the dep graph. See test/mollusk_smoke.rs for usage.
solana-instruction = "3"
solana-pubkey = "3"
solana-account = "3"
solana-program-error = "3"
