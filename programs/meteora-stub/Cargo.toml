[package]
name = "meteora-stub"
version = "0.0.1"
edition = "2021"
description = "Test-only stub of Meteora DAMM v2 for Mollusk CPI testing. NOT for deployment."

[lib]
crate-type = ["cdylib", "lib"]
name = "meteora_stub"

[features]
no-entrypoint = []
# Not actually used — anchor build emits idl JSON for every workspace
# member, so the feature must exist even though we have no Anchor accounts.
idl-build = []
# Not actually used — declared here so `anchor build -- --features mainnet`
# doesn't error on workspace-wide feature propagation. The stub is test-only
# and never deployed; same trick as idl-build above.
mainnet = []

[dependencies]
solana-program-entrypoint = "3"
solana-program-error = "3"
solana-account-info = "3"
solana-pubkey = "3"
solana-msg = "3"
