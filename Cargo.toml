[workspace]
members = [
    "programs/launchctrl",
    "programs/meteora-stub",
]
resolver = "2"


[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true

[profile.release.build-override]
opt-level = "z"
incremental = false
codegen-units = 1

[workspace.metadata.solana]
stack-frame-size = 8192
